{% extends "base.html" %}

{% block title %}New direct chat · Fools Arena{% endblock %}

{% block content %}
<h2>Open or continue a direct chat</h2>
<p>Enter the other player's username (same account as used to log in).</p>

<form method="post" action="">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Open chat</button>
</form>
<p><a href="{% url 'chat:inbox' %}">Back to inbox</a></p>
{% endblock %}
